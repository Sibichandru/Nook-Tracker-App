<!--
  Monochrome mark: Android themed ("monochrome") icons and the status-bar icon.

  Variant "tinted" / "status bar" from direction 4e — the letterform alone, no
  coin. Android keeps only the alpha channel and tints the whole shape one
  colour, so the amber coin would flatten into the right stem and read as a
  blob at 24dp. One flat fill on transparency; do not add colours here.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100"><g stroke="#000000" stroke-width="10.5" stroke-linecap="round" fill="none"><line x1="32.25" y1="32.25" x2="32.25" y2="67.75"/><line x1="67.75" y1="32.25" x2="67.75" y2="67.75"/><line x1="25.6" y1="34.83" x2="49.3" y2="65.17"/></g></svg>
